syntax = "proto3";

package delivery.v1;

option go_package = "github.com/ThDawnWind/food-delivery-contracts/gen/go/delivery/v1;deliveryv1";

message CalculateDeliveryRequest {
    int64 order_amount = 1;
}

message CalculateDeliveryResponse {
    int64 delivery_price = 1;
}

message TrackDeliveryRequest {
    int64 delivery_id = 1;
}

enum DeliveryStatus {
    DELIVERY_STATUS_UNSPECIFIED = 0;
    DELIVERY_STATUS_CREATED = 1;
    DELIVERY_STATUS_COURIER_ASSIGNED = 2;
    DELIVERY_STATUS_PICKED_UP = 3;
    DELIVERY_STATUS_ON_THE_WAY = 4;
    DELIVERY_STATUS_DELIVERED = 5;
}

message DeliveryStatusUpdate {
    int64 delivery_id = 1;
    DeliveryStatus status = 2;
}
service DeliveryService {
    rpc CalculateDelivery(CalculateDeliveryRequest)
        returns (CalculateDeliveryResponse);

    rpc TrackDelivery(TrackDeliveryRequest)
        returns (stream DeliveryStatusUpdate);
 }
